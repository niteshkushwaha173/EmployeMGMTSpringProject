spring.application.name=employee-backend

# Local run ke liye application-local.properties (git-ignored) load hoti hai
spring.profiles.default=local

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:employee_db}${DB_PARAMS:}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update

# Render PORT deta hai, local mein 8284
server.port=${PORT:${SERVER_PORT:8284}}

# Ye naam tumhare JwtService ke @Value se match hone chahiye
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
